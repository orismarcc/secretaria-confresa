name: Verificações

# Roda a cada envio de código (qualquer branch) e em pull requests.
# NÃO publica nada e NÃO toca a produção:
#   - app: trava de dados pessoais, tipos, testes e build;
#   - banco: sobe um Supabase TEMPORÁRIO (descartado no fim), aplica TODAS as
#     migrations do zero e roda os testes de permissões (supabase/tests).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Trava de dados pessoais no código
        run: node scripts/verificar-dados-pessoais.mjs

      - name: Tipos (TypeScript)
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: Testes
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Valores fictícios: o build não acessa o banco.
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_ficticia

  banco:
    name: Banco (estrutura da produção + migrations novas + permissões)
    # Precisa dos secrets do repositório (não disponíveis em PR de fork).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      LOCAL_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - name: Vincular ao projeto (somente leitura nesta etapa)
        run: supabase link --project-ref pqvsdzvmbwbotkfggcxc -p "$DB_PASSWORD"

      # As migrations antigas NÃO recriam o banco do zero (algumas tabelas, ex.
      # deliveries, nasceram no painel). Por isso o teste parte da ESTRUTURA
      # real da produção — sem nenhum dado — e aplica só as migrations novas.
      - name: Copiar SÓ a estrutura da produção (sem dados) e o que já foi aplicado
        run: |
          supabase db dump --linked -p "$DB_PASSWORD" -f "$RUNNER_TEMP/estrutura.sql"
          supabase migration list --linked -p "$DB_PASSWORD" > "$RUNNER_TEMP/lista.txt"
          # versões que já estão na produção (coluna "Remote")
          awk -F'|' 'NR>2 { gsub(/ /,"",$2); if ($2 ~ /^[0-9]+$/) print $2 }' "$RUNNER_TEMP/lista.txt" > "$RUNNER_TEMP/remotas.txt"
          echo "Migrations já na produção: $(wc -l < "$RUNNER_TEMP/remotas.txt")"
          test -s "$RUNNER_TEMP/estrutura.sql"
          test -s "$RUNNER_TEMP/remotas.txt"

      - name: Subir Supabase temporário (vazio)
        run: |
          mv supabase/migrations "$RUNNER_TEMP/migrations"
          mkdir supabase/migrations
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          rmdir supabase/migrations
          mv "$RUNNER_TEMP/migrations" supabase/migrations

      - name: Carregar a estrutura da produção
        run: |
          # Papéis (roles) que só existem na produção e recebem permissões na
          # estrutura: criados aqui como fictícios, SEM login.
          psql "$LOCAL_DB" -Atc "select rolname from pg_roles" | sort > "$RUNNER_TEMP/roles_locais.txt"
          grep -oE '(TO|OWNER TO|FROM) "?[A-Za-z_][A-Za-z0-9_]*"?' "$RUNNER_TEMP/estrutura.sql"             | awk '{print $NF}' | tr -d '"' | grep -viE '^(public|current_user|session_user)$' | sort -u > "$RUNNER_TEMP/roles_citados.txt"
          for r in $(comm -13 "$RUNNER_TEMP/roles_locais.txt" "$RUNNER_TEMP/roles_citados.txt"); do
            echo "Criando papel fictício: $r"
            psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -qc "CREATE ROLE \"$r\" NOLOGIN"
          done
          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/estrutura.sql"

      - name: Aplicar SÓ as migrations que ainda não estão na produção
        run: |
          n=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            v=$(basename "$f" | cut -d_ -f1)
            if ! grep -qx "$v" "$RUNNER_TEMP/remotas.txt"; then
              echo "Aplicando (nova): $(basename "$f")"
              psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -q -f "$f"
              n=$((n+1))
            fi
          done
          echo "Migrations novas aplicadas: $n"

      - name: Testes de permissões e regras do banco
        run: supabase test db

      - name: Desligar
        if: always()
        run: supabase stop --no-backup
